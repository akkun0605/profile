<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>akkun | Profile</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
      background: #101116;
      color: #f5f5f7;
      font-family: Arial, sans-serif;
    }

    .profile {
      width: 100%;
      max-width: 440px;
    }

    .header {
      text-align: center;
      padding: 32px 20px;
      background: #191a22;
      border: 1px solid #30313b;
      border-radius: 20px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      background: #30313b;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: 26px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #b5b6c0;
      font-size: 14px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #80848e;
    }

    .message {
      margin-top: 12px;
      color: #a5a6b0;
      font-size: 13px;
      min-height: 16px;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .card {
      min-height: 110px;
      padding: 20px;
      background: #191a22;
      border: 1px solid #30313b;
      border-radius: 16px;
    }

    .card:last-child {
      grid-column: span 2;
    }

    .label {
      color: #858691;
      font-size: 11px;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    .value {
      font-size: 14px;
      line-height: 1.8;
      font-weight: 600;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: #9da5ff;
    }

    footer {
      margin-top: 22px;
      text-align: center;
      color: #656672;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="profile">

    <section class="header">
      <img
        id="avatar"
        class="avatar"
        src="https://cdn.discordapp.com/embed/avatars/0.png"
        alt="Profile picture"
      >

      <h1 id="name">akkun</h1>

      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">불러오는 중</span>
      </div>

      <div class="message" id="statusMessage"></div>
    </section>

    <section class="cards">

      <div class="card">
        <div class="label">EMAIL</div>
        <div class="value">
          <a href="mailto:akkun1@proton.me">
            akkun1@proton.me
          </a>
        </div>
      </div>

      <div class="card">
        <div class="label">GAMES</div>
        <div class="value">
          Blue Archive<br>
          MSFS2020
        </div>
      </div>

      <div class="card">
        <div class="label">ROBLOX</div>
        <div class="value">
          <a
            href="https://www.roblox.com/ko/users/3966349192/profile"
            target="_blank"
            rel="noopener noreferrer"
          >
            Roblox Profile ↗
          </a>
        </div>
      </div>

    </section>

    <footer>© 2026 akkun. All rights reserved.</footer>

  </main>

  <script>
    const API = "https://profile-api.leesan0905.workers.dev";

    const statusInfo = {
      online: { text: "온라인", color: "#23a55a" },
      idle: { text: "자리 비움", color: "#f0b232" },
      dnd: { text: "다른 용무 중", color: "#f23f43" },
      offline: { text: "오프라인", color: "#80848e" }
    };

    async function loadProfile() {
      try {
        const response = await fetch(API + "/profile");
        if (!response.ok) return;

        const data = await response.json();

        document.getElementById("name").textContent =
          data.display_name || data.username || "akkun";

        document.getElementById("avatar").src =
          data.avatar_url;
      } catch (error) {
        console.error("Profile loading failed:", error);
      }
    }

    async function loadStatus() {
      try {
        const response = await fetch(API + "/status");
        if (!response.ok) return;

        const data = await response.json();
        const info = statusInfo[data.status] || statusInfo.offline;

        document.getElementById("statusText").textContent =
          info.text;

        document.getElementById("statusDot").style.background =
          info.color;

        document.getElementById("statusMessage").textContent =
          data.message || "";
      } catch (error) {
        console.error("Status loading failed:", error);
      }
    }

    loadProfile();
    loadStatus();

    setInterval(loadStatus, 15000);
    setInterval(loadProfile, 60000);

    @font-face {
  font-family: "AkkunFont";
  src: url("./fonts/my-font.otf") format("opentype");
  font-weight: 100 900;
  font-display: swap;
}

body {
  font-family: "AkkunFont", sans-serif;
}
  </script>
</body>
</html>
