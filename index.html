
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>akkun.</title>

  <style>
    @font-face {
      font-family: "GyeonggiBatang";
      src: url("./fonts/경기천년바탕OTF_Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --background: #111111;
      --foreground: #eeeeee;
      --secondary: #858585;
      --line: #292929;
      --dot: #777777;
    }

    [data-theme="light"] {
      color-scheme: light;
      --background: #f7f7f5;
      --foreground: #202020;
      --secondary: #777777;
      --line: #ddddda;
      --dot: #999999;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--background);
      color: var(--foreground);
      font-family: "GyeonggiBatang", serif;
      transition: background 0.2s, color 0.2s;
    }

    header {
      height: 76px;
      padding: 0 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: var(--foreground);
      font-size: 21px;
      text-decoration: none;
      letter-spacing: -1px;
    }

    #themeToggle {
      border: 0;
      background: transparent;
      color: var(--secondary);
      font-size: 19px;
      cursor: pointer;
      padding: 8px;
    }

    main {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .profile {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    #avatar {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--line);
      display: block;
      margin: 0 auto 25px;
    }

    #name {
      font-size: 27px;
      font-weight: 400;
      letter-spacing: -0.8px;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
      color: var(--secondary);
      font-size: 13px;
    }

    #statusDot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--dot);
    }

    #statusMessage {
      min-height: 20px;
      margin-top: 10px;
      color: var(--secondary);
      font-size: 13px;
    }

    .links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 17px;
      margin-top: 38px;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .links a,
    .links span {
      color: var(--secondary);
      text-decoration: none;
      transition: color 0.2s;
    }

    .links a:hover {
      color: var(--foreground);
    }

    .separator {
      color: var(--line) !important;
    }

    footer {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--secondary);
      font-size: 11px;
    }

    @media (max-width: 480px) {
      header {
        padding: 0 6%;
      }

      #avatar {
        width: 104px;
        height: 104px;
      }

      #name {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="./">akkun.</a>
    <button id="themeToggle" aria-label="테마 변경">☼</button>
  </header>

  <main>
    <section class="profile">
      <img id="avatar" src="" alt="Discord profile">

      <h1 id="name">akkun</h1>

      <div class="status">
        <span id="statusDot"></span>
        <span id="statusText">Loading...</span>
      </div>

      <p id="statusMessage"></p>

      <nav class="links">
        <a href="mailto:akkun1@proton.me">EMAIL</a>
        <span class="separator">/</span>
        <span title="Blue Archive · MSFS2020">GAMES</span>
        <span class="separator">/</span>
        <a
          href="https://www.roblox.com/ko/users/3966349192/profile"
          target="_blank"
          rel="noopener noreferrer"
        >ROBLOX</a>
      </nav>
    </section>
  </main>

  <footer>
    © 2026 akkun.
  </footer>

  <script>
    const API = "https://profile-api.leesan0905.workers.dev";

    const statusInfo = {
      online: {
        text: "Online",
        color: "#23a55a"
      },
      idle: {
        text: "Away",
        color: "#f0b232"
      },
      dnd: {
        text: "Do Not Disturb",
        color: "#f23f43"
      },
      offline: {
        text: "Offline",
        color: "#80848e"
      }
    };

    async function loadProfile() {
      try {
        const response = await fetch(API + "/profile");
        if (!response.ok) throw new Error("Profile request failed");

        const data = await response.json();

        document.getElementById("name").textContent =
          data.display_name || data.username || "akkun";

        if (data.avatar_url) {
          document.getElementById("avatar").src = data.avatar_url;
        }
      } catch (error) {
        console.error("Profile loading error:", error);
      }
    }

    async function loadStatus() {
      try {
        const response = await fetch(API + "/status");
        if (!response.ok) throw new Error("Status request failed");

        const data = await response.json();
        const info = statusInfo[data.status] || statusInfo.offline;

        document.getElementById("statusText").textContent = info.text;
        document.getElementById("statusDot").style.background = info.color;
        document.getElementById("statusMessage").textContent =
          data.message || "";
      } catch (error) {
        console.error("Status loading error:", error);
        document.getElementById("statusText").textContent = "Offline";
      }
    }

    // Theme
    const themeToggle = document.getElementById("themeToggle");

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      themeToggle.textContent = theme === "dark" ? "☼" : "☾";
      localStorage.setItem("akkun-theme", theme);
    }

    const savedTheme = localStorage.getItem("akkun-theme");
    applyTheme(savedTheme || "dark");

    themeToggle.addEventListener("click", () => {
      const currentTheme =
        document.documentElement.dataset.theme;

      applyTheme(currentTheme === "dark" ? "light" : "dark");
    });

    // Initial load
    loadProfile();
    loadStatus();

    // Automatic refresh
    setInterval(loadStatus, 15000);
    setInterval(loadProfile, 60000);
  </script>
</body>
</html>
