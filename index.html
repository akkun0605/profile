
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>akkun — Profile</title>

  <style>
    @font-face {
      font-family: "MyFont";
      src: url("./my-font.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --bg: #111111;
      --panel: rgba(25, 25, 25, .78);
      --panel-hover: rgba(38, 38, 38, .85);
      --text: #eeeeee;
      --sub: #929292;
      --border: rgba(255,255,255,.09);
      --shadow: rgba(0,0,0,.28);
      --accent: #d8d8d8;
      --overlay: rgba(0,0,0,.58);
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #eeeeee;
      --panel: rgba(255,255,255,.76);
      --panel-hover: rgba(255,255,255,.95);
      --text: #202020;
      --sub: #777777;
      --border: rgba(0,0,0,.09);
      --shadow: rgba(0,0,0,.08);
      --accent: #333333;
      --overlay: rgba(0,0,0,.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(100,100,100,.09), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      overflow-x: hidden;
      transition: background .25s, color .25s;
    }

    button {
      font: inherit;
    }

    .background-noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .035;
      z-index: -1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
    }

    /* 상단 음악 플레이어 */

    .music-player {
      position: fixed;
      top: 27px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 13px;
      width: 280px;
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 8px 30px var(--shadow);
      z-index: 5;
    }

    .album-art {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--panel-hover);
      color: var(--sub);
    }

    .album-art svg {
      width: 17px;
      height: 17px;
    }

    .music-info {
      flex: 1;
      min-width: 0;
    }

    .music-title {
      font-size: 12px;
      font-weight: 600;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .music-artist {
      margin-top: 4px;
      color: var(--sub);
      font-size: 10px;
      letter-spacing: .5px;
    }

    .music-controls {
      display: flex;
      gap: 8px;
      color: var(--sub);
    }

    .music-controls button {
      border: 0;
      background: none;
      color: inherit;
      cursor: default;
      opacity: .45;
    }

    /* 테마 버튼 */

    .theme-button {
      position: fixed;
      top: 28px;
      right: 32px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      transition: .2s;
      z-index: 10;
    }

    .theme-button:hover {
      background: var(--panel-hover);
      transform: translateY(-2px);
    }

    .theme-button svg {
      width: 17px;
      height: 17px;
    }

    /* 왼쪽 메뉴 */

    .sidebar {
      position: fixed;
      top: 50%;
      left: 30px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 13px 9px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 8px 30px var(--shadow);
      z-index: 5;
    }

    .menu-item {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: var(--sub);
      text-decoration: none;
      cursor: pointer;
      transition: .2s;
      position: relative;
    }

    .menu-item:hover {
      color: var(--text);
      background: var(--panel-hover);
      transform: translateY(-2px);
    }

    .menu-item svg {
      width: 19px;
      height: 19px;
    }

    .menu-item.active {
      color: var(--text);
      background: var(--panel-hover);
    }

    .menu-divider {
      width: 22px;
      height: 1px;
      background: var(--border);
    }

    .menu-text {
      font-size: 11px;
      font-weight: 600;
    }

    /* 메인 영역 */

    .main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 110px 24px 70px;
    }

    .profile-panel {
      width: min(540px, 100%);
      min-height: 330px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 30px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--panel);
      backdrop-filter: blur(22px);
      box-shadow: 0 15px 50px var(--shadow);
      text-align: center;
      animation: panelAppear .7s ease both;
    }

    @keyframes panelAppear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .avatar-wrap {
      position: relative;
      margin-bottom: 19px;
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--panel-hover);
      border: 2px solid var(--border);
    }

    .status-dot {
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 19px;
      height: 19px;
      border: 4px solid var(--bg);
      border-radius: 50%;
      background: #80848e;
    }

    .username {
      font-family: "MyFont", Arial, sans-serif;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -.5px;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 11px;
      color: var(--sub);
      font-size: 12px;
    }

    .status-message {
      margin-top: 12px;
      color: var(--sub);
      font-size: 12px;
      line-height: 1.6;
      word-break: break-word;
    }

    .socials {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 27px;
    }

    .social-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel-hover);
      color: var(--sub);
      cursor: pointer;
      transition: .2s;
    }

    .social-button:hover {
      color: var(--text);
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .social-button svg {
      width: 19px;
      height: 19px;
    }

    .roblox-icon {
      width: 19px;
      height: 19px;
      object-fit: contain;
      filter: grayscale(1) brightness(0) invert(1);
      transition: .2s;
    }

    [data-theme="light"] .roblox-icon {
      filter: grayscale(1) brightness(0);
    }

    /* 하단 */

    .footer {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--sub);
      font-size: 10px;
      letter-spacing: .5px;
      opacity: .7;
      white-space: nowrap;
    }

    /* 모달 */

    .modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--overlay);
      backdrop-filter: blur(5px);
      z-index: 100;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: min(390px, 100%);
      padding: 27px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--panel);
      backdrop-filter: blur(25px);
      box-shadow: 0 20px 70px rgba(0,0,0,.3);
      animation:
        modalAppear .2s ease-out,
        gentleFloat 2.8s ease-in-out .2s infinite;
    }

    @keyframes modalAppear {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes gentleFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-3px);
      }
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 11px;
    }

    .modal-description {
      color: var(--sub);
      font-size: 12px;
      line-height: 1.7;
      margin-bottom: 13px;
    }

    .modal-link {
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel-hover);
      color: var(--sub);
      font-size: 11px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      margin-bottom: 17px;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-button {
      padding: 9px 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-hover);
      color: var(--text);
      font-size: 11px;
      cursor: pointer;
      transition: .2s;
    }

    .modal-button:hover {
      filter: brightness(1.15);
    }

    .modal-button.primary {
      background: var(--text);
      color: var(--bg);
      border-color: transparent;
    }

    .email-address {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel-hover);
      margin: 14px 0 17px;
    }

    .email-address span {
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .copy-button {
      flex-shrink: 0;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
      font-size: 10px;
      cursor: pointer;
    }

    /* 모바일 */

    @media (max-width: 650px) {
      .music-player {
        top: 18px;
        left: 16px;
        transform: none;
        width: 225px;
      }

      .theme-button {
        top: 20px;
        right: 17px;
      }

      .sidebar {
        top: auto;
        left: 50%;
        bottom: 23px;
        transform: translateX(-50%);
        flex-direction: row;
        padding: 8px 11px;
        gap: 8px;
      }

      .menu-divider {
        width: 1px;
        height: 22px;
      }

      .main {
        padding: 100px 17px 105px;
      }

      .profile-panel {
        min-height: 310px;
        padding: 35px 20px;
      }

      .footer {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="background-noise"></div>

  <!-- 음악 플레이어 -->
  <div class="music-player">
    <div class="album-art">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>
    </div>

    <div class="music-info">
      <div class="music-title">재생할 음악이 없습니다</div>
      <div class="music-artist">PLAYLIST · 준비 중</div>
    </div>

    <div class="music-controls">
      <button aria-label="이전 곡">‹</button>
      <button aria-label="재생">▶</button>
      <button aria-label="다음 곡">›</button>
    </div>
  </div>

  <!-- 테마 변경 -->
  <button class="theme-button" id="themeButton" aria-label="테마 변경">
    <svg id="themeIcon" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
    </svg>
  </button>

  <!-- 사이드바 -->
  <nav class="sidebar">
    <a class="menu-item active" href="#" title="홈">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/>
      </svg>
    </a>

    <div class="menu-divider"></div>

    <div class="menu-item" title="Blue Archive · MSFS2020">
      <span class="menu-text">게임</span>
    </div>

    <a class="menu-item"
      href="https://www.roblox.com/users/3966349192/profile"
      target="_blank" rel="noopener noreferrer" title="Roblox">
      <img class="roblox-icon"
        src="https://images.icon-icons.com/3914/PNG/512/roblox_logo_icon_248636.png"
        alt="Roblox">
    </a>

    <button class="menu-item" id="emailMenu" title="이메일">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <path d="m3 7 9 6 9-6"/>
      </svg>
    </button>
  </nav>

  <!-- 프로필 -->
  <main class="main">
    <section class="profile-panel">
      <div class="avatar-wrap">
        <img class="avatar" id="avatar" src="" alt="프로필 이미지">
        <span class="status-dot" id="statusDot"></span>
      </div>

      <h1 class="username" id="name">akkun</h1>

      <div class="status-line">
        <span id="statusText">연결 중...</span>
      </div>

      <p class="status-message" id="statusMessage"></p>

      <div class="socials">
        <button class="social-button" id="emailSocial" title="이메일">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="m3 7 9 6 9-6"/>
          </svg>
        </button>

        <button class="social-button" id="robloxSocial" title="Roblox">
          <img class="roblox-icon"
            src="https://images.icon-icons.com/3914/PNG/512/roblox_logo_icon_248636.png"
            alt="Roblox">
        </button>
      </div>
    </section>
  </main>

  <footer class="footer">
    © 2026 AKKUN. ALL RIGHTS RESERVED.
  </footer>

  <!-- Roblox 팝업 -->
  <div class="modal-overlay" id="robloxModal">
    <div class="modal">
      <h2 class="modal-title">잠시만요!!</h2>

      <p class="modal-description">
        외부 사이트로 이동하고 계세요.
      </p>

      <div class="modal-link">
        링크 https://www.roblox.com/users/3966349192/... 를 새 탭에서 열까요?
      </div>

      <div class="modal-buttons">
        <button class="modal-button" data-close="robloxModal">취소</button>
        <button class="modal-button primary" id="robloxGo">↗ 들어가기</button>
      </div>
    </div>
  </div>

  <!-- 이메일 팝업 -->
  <div class="modal-overlay" id="emailModal">
    <div class="modal">
      <h2 class="modal-title">이메일</h2>

      <p class="modal-description">비즈니스, 제휴</p>

      <div class="email-address">
        <span id="emailText">akkun1@proton.me</span>
        <button class="copy-button" id="copyEmail">복사하기</button>
      </div>

      <div class="modal-buttons">
        <button class="modal-button" data-close="emailModal">닫기</button>
      </div>
    </div>
  </div>

  <script>
    const API = "https://profile-api.leesan0905.workers.dev";

    const statusInfo = {
      online: { text: "온라인", color: "#23a55a" },
      idle: { text: "다른 용무 중", color: "#f0b232" },
      dnd: { text: "방해 금지", color: "#f23f43" },
      offline: { text: "오프라인", color: "#80848e" }
    };

    // 테마 설정
    const themeButton = document.getElementById("themeButton");
    const themeIcon = document.getElementById("themeIcon");

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("akkun-theme", theme);

      if (theme === "light") {
        themeIcon.innerHTML = `
          <path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5
          8.5 8.5 0 1 0 20.5 15.5Z"/>
        `;
      } else {
        themeIcon.innerHTML = `
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42
          m11.3 11.3 1.42 1.42M2 12h2m16 0h2
          M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
        `;
      }
    }

    const savedTheme = localStorage.getItem("akkun-theme") || "dark";
    setTheme(savedTheme);

    themeButton.addEventListener("click", () => {
      const current = document.documentElement.dataset.theme;
      setTheme(current === "dark" ? "light" : "dark");
    });

    // API 요청
    async function fetchAPI(path) {
      const response = await fetch(API + path, {
        method: "GET",
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`${path} 요청 실패: HTTP ${response.status}`);
      }

      return await response.json();
    }

    // Discord 프로필
    async function loadProfile() {
      try {
        const data = await fetchAPI("/profile");

        document.getElementById("name").textContent =
          data.display_name || data.username || "akkun";

        if (data.avatar_url) {
          document.getElementById("avatar").src = data.avatar_url;
        }
      } catch (error) {
        console.error("프로필 불러오기 오류:", error);
      }
    }

    // Discord 상태
    async function loadStatus() {
      try {
        const data = await fetchAPI("/status");
        const info = statusInfo[data.status] || statusInfo.offline;

        document.getElementById("statusText").textContent = info.text;
        document.getElementById("statusDot").style.background = info.color;
        document.getElementById("statusMessage").textContent =
          data.message || "";

      } catch (error) {
        console.error("상태 불러오기 오류:", error);

        document.getElementById("statusText").textContent = "연결 오류";
        document.getElementById("statusDot").style.background = "#80848e";
      }
    }

    loadProfile();
    loadStatus();

    setInterval(loadStatus, 15000);
    setInterval(loadProfile, 60000);

    // 모달 열기
    function openModal(id) {
      document.getElementById(id).classList.add("show");
    }

    // 모달 닫기
    function closeModal(id) {
      document.getElementById(id).classList.remove("show");
    }

    document.getElementById("robloxSocial").addEventListener("click", () => {
      openModal("robloxModal");
    });

    document.getElementById("emailSocial").addEventListener("click", () => {
      openModal("emailModal");
    });

    document.getElementById("emailMenu").addEventListener("click", () => {
      openModal("emailModal");
    });

    // 취소 및 닫기 버튼
    document.querySelectorAll("[data-close]").forEach(button => {
      button.addEventListener("click", () => {
        closeModal(button.dataset.close);
      });
    });

    // 모달 바깥 클릭
    document.querySelectorAll(".modal-overlay").forEach(overlay => {
      overlay.addEventListener("click", event => {
        if (event.target === overlay) {
          overlay.classList.remove("show");
        }
      });
    });

    // ESC 키
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        document.querySelectorAll(".modal-overlay").forEach(modal => {
          modal.classList.remove("show");
        });
      }
    });

    // Roblox 새 탭 열기
    document.getElementById("robloxGo").addEventListener("click", () => {
      window.open(
        "https://www.roblox.com/users/3966349192/profile",
        "_blank",
        "noopener,noreferrer"
      );

      closeModal("robloxModal");
    });

    // 이메일 복사
    document.getElementById("copyEmail").addEventListener("click", async () => {
      const email = "akkun1@proton.me";
      const button = document.getElementById("copyEmail");

      try {
        await navigator.clipboard.writeText(email);
        button.textContent = "복사 완료!";
      } catch (error) {
        console.error("이메일 복사 오류:", error);
        button.textContent = "복사 실패";
      }

      setTimeout(() => {
        button.textContent = "복사하기";
      }, 1600);
    });
  </script>
</body>
</html>
