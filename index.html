
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>akkun | Profile</title>

  <style>
    @font-face {
      font-family: "AkkunFont";
      src: url("./fonts/my-font.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #101116;
      --surface: #191a22;
      --surface-hover: #20212b;
      --border: #30313b;
      --text: #f5f5f7;
      --subtext: #a5a6b0;
      --muted: #777985;
      --accent: #a5adff;
      --shadow: 0 20px 60px rgba(0,0,0,.15);
    }

    [data-theme="light"] {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface-hover: #f0f0f4;
      --border: #e5e5eb;
      --text: #20212a;
      --subtext: #696b78;
      --muted: #999ba5;
      --accent: #626edb;
      --shadow: 0 20px 60px rgba(0,0,0,.05);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "AkkunFont", Arial, sans-serif;
      transition: background .3s, color .3s;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(100% - 40px, 960px);
      margin: auto;
    }

    /* Navigation */

    .navbar {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 19px;
      font-weight: bold;
      letter-spacing: -.5px;
    }

    .logo span {
      color: var(--accent);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .nav-links a {
      color: var(--subtext);
      font-size: 13px;
      transition: color .2s;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .theme-button {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: .2s;
    }

    .theme-button:hover {
      background: var(--surface-hover);
      transform: translateY(-2px);
    }

    /* Main */

    main {
      padding: 100px 0 80px;
    }

    .intro {
      text-align: center;
      margin-bottom: 65px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 28px;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 18px;
      height: 1px;
      background: var(--border);
    }

    .avatar-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 22px;
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface);
      border: 3px solid var(--surface);
      box-shadow: 0 0 0 1px var(--border);
    }

    .avatar-indicator {
      position: absolute;
      right: 5px;
      bottom: 7px;
      width: 19px;
      height: 19px;
      border: 4px solid var(--bg);
      border-radius: 50%;
      background: #80848e;
      transition: background .3s;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 40px);
      letter-spacing: -1.5px;
    }

    .description {
      margin-top: 12px;
      color: var(--subtext);
      font-size: 14px;
    }

    .status-line {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 23px;
      padding: 9px 15px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--surface);
      color: var(--subtext);
      font-size: 12px;
    }

    .status-message {
      min-height: 18px;
      margin-top: 13px;
      color: var(--muted);
      font-size: 13px;
    }

    /* Section */

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .section-heading span {
      color: var(--muted);
      font-size: 11px;
    }

    /* Cards */

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .card {
      position: relative;
      min-height: 165px;
      padding: 23px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 17px;
      transition: transform .25s, background .25s, border-color .25s;
    }

    .card:hover {
      transform: translateY(-5px);
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .card-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--accent);
      font-size: 15px;
    }

    .card-arrow {
      color: var(--muted);
      font-size: 15px;
      transition: transform .2s;
    }

    .card:hover .card-arrow {
      transform: translate(3px, -3px);
    }

    .card-label {
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 2px;
    }

    .card-value {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.9;
    }

    .card-value a:hover {
      color: var(--accent);
    }

    /* Footer */

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 75px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
    }

    .footer-right {
      letter-spacing: 1px;
    }

    /* Responsive */

    @media (max-width: 650px) {
      .container {
        width: min(100% - 32px, 480px);
      }

      .navbar {
        height: 70px;
      }

      .nav-links {
        gap: 15px;
      }

      .nav-links a {
        font-size: 11px;
      }

      .nav-right {
        gap: 15px;
      }

      main {
        padding: 75px 0 55px;
      }

      .intro {
        margin-bottom: 50px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 145px;
      }

      footer {
        margin-top: 55px;
      }
    }

    @media (max-width: 380px) {
      .nav-links {
        gap: 10px;
      }

      .nav-links a {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Navigation -->
    <nav class="navbar">
      <a href="#" class="logo">akkun<span>.</span></a>

      <div class="nav-right">
        <div class="nav-links">
          <a href="#home">HOME</a>
          <a href="#profile">PROFILE</a>
          <a href="#contact">CONTACT</a>
        </div>

        <button
          class="theme-button"
          id="themeToggle"
          aria-label="테마 변경"
          title="테마 변경"
        >
          <span id="themeIcon">☾</span>
        </button>
      </div>
    </nav>

    <!-- Main -->
    <main id="home">

      <section class="intro" id="profile">

        <div class="eyebrow">PERSONAL PROFILE</div>

        <div class="avatar-wrap">
          <img
            id="avatar"
            class="avatar"
            src="https://cdn.discordapp.com/embed/avatars/0.png"
            alt="Profile picture"
          >
          <span
            class="avatar-indicator"
            id="statusDot"
          ></span>
        </div>

        <h1 id="name">akkun</h1>

        <div class="description">
          Welcome to my personal space.
        </div>

        <div class="status-line">
          <span id="statusText">불러오는 중</span>
        </div>

        <div class="status-message" id="statusMessage"></div>

      </section>

      <!-- Information -->
      <section id="contact">

        <div class="section-heading">
          <h2>INFORMATION</h2>
          <span>01 — 03</span>
        </div>

        <div class="cards">

          <!-- Email -->
          <div class="card">
            <div class="card-top">
              <div class="card-icon">✉</div>
              <span class="card-arrow">↗</span>
            </div>

            <div class="card-label">EMAIL</div>

            <div class="card-value">
              <a href="mailto:akkun1@proton.me">
                akkun1@proton.me
              </a>
            </div>
          </div>

          <!-- Games -->
          <div class="card">
            <div class="card-top">
              <div class="card-icon">◈</div>
              <span class="card-arrow">↗</span>
            </div>

            <div class="card-label">GAMES</div>

            <div class="card-value">
              Blue Archive<br>
              MSFS2020
            </div>
          </div>

          <!-- Roblox -->
          <div class="card">
            <div class="card-top">
              <div class="card-icon">◇</div>
              <span class="card-arrow">↗</span>
            </div>

            <div class="card-label">ROBLOX</div>

            <div class="card-value">
              <a
                href="https://www.roblox.com/ko/users/3966349192/profile"
                target="_blank"
                rel="noopener noreferrer"
              >
                Roblox Profile
              </a>
            </div>
          </div>

        </div>
      </section>

      <footer>
        <span>© 2026 akkun. All rights reserved.</span>
        <span class="footer-right">PERSONAL WEBSITE</span>
      </footer>

    </main>
  </div>

  <script>
    const API = "https://profile-api.leesan0905.workers.dev";

    const statusInfo = {
      online: {
        text: "온라인",
        color: "#23a55a"
      },
      idle: {
        text: "자리 비움",
        color: "#f0b232"
      },
      dnd: {
        text: "다른 용무 중",
        color: "#f23f43"
      },
      offline: {
        text: "오프라인",
        color: "#80848e"
      }
    };

    // Discord profile
    async function loadProfile() {
      try {
        const response = await fetch(API + "/profile");

        if (!response.ok) return;

        const data = await response.json();

        document.getElementById("name").textContent =
          data.display_name || data.username || "akkun";

        if (data.avatar_url) {
          document.getElementById("avatar").src =
            data.avatar_url;
        }

      } catch (error) {
        console.error("Profile loading failed:", error);
      }
    }

    // Discord status
    async function loadStatus() {
      try {
        const response = await fetch(API + "/status");

        if (!response.ok) return;

        const data = await response.json();

        const info =
          statusInfo[data.status] || statusInfo.offline;

        document.getElementById("statusText").textContent =
          info.text;

        document.getElementById("statusDot").style.background =
          info.color;

        document.getElementById("statusMessage").textContent =
          data.message || "";

      } catch (error) {
        console.error("Status loading failed:", error);
      }
    }

    // Theme toggle
    const themeToggle = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;

      themeIcon.textContent =
        theme === "dark" ? "☾" : "☀";

      localStorage.setItem("akkun-theme", theme);
    }

    const savedTheme = localStorage.getItem("akkun-theme");
    setTheme(savedTheme || "dark");

    themeToggle.addEventListener("click", () => {
      const currentTheme =
        document.documentElement.dataset.theme;

      setTheme(currentTheme === "dark" ? "light" : "dark");
    });

    // Initial loading
    loadProfile();
    loadStatus();

    // Automatic refresh
    setInterval(loadStatus, 15000);
    setInterval(loadProfile, 60000);
  </script>

</body>
</html>
